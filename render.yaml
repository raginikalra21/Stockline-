services:
  - type: web
    name: stockline
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health/readiness
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        fromDatabase:
          name: stockline-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: stockline-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: stockline-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: STOCKLINE_ADMIN_USERNAME
        sync: false
      - key: STOCKLINE_ADMIN_PASSWORD
        sync: false
      - key: STOCKLINE_SECURE_COOKIE
        value: "true"
      - key: DB_POOL_MAX
        value: "8"
      - key: DB_POOL_MIN_IDLE
        value: "1"
      - key: SERVER_TOMCAT_MAX_THREADS
        value: "50"
      - key: SERVER_TOMCAT_MIN_SPARE_THREADS
        value: "5"
