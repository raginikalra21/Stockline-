services:
  - type: web
    name: stockline
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health/readiness
    maxShutdownDelaySeconds: 60
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_URL
        fromDatabase:
          name: stockline-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: stockline-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: stockline-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: STOCKLINE_ADMIN_USERNAME
        sync: false
      - key: STOCKLINE_ADMIN_PASSWORD
        sync: false
      - key: STOCKLINE_SECURE_COOKIE
        value: "true"
      - key: DB_POOL_MAX
        value: "24"
      - key: DB_POOL_MIN_IDLE
        value: "4"

databases:
  - name: stockline-db
    databaseName: stockline
    user: stockline
    plan: 0.5c-1g
    region: singapore
    postgresMajorVersion: "16"
