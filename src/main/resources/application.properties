spring.application.name=stockline
server.port=8080
spring.profiles.default=dev
spring.sql.init.mode=never
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=Existing Stockline schema before Flyway
spring.datasource.hikari.maximum-pool-size=24
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
server.error.include-message=never
stockline.fulfillment-delay=12s
stockline.worker-interval-ms=500
stockline.retry.max-attempts=8
stockline.retry.base-delay=2ms
stockline.retry.max-delay=100ms
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
