spring.application.name=stockline
server.port=${PORT:8080}
spring.profiles.default=dev
spring.profiles.group.local-demo=dev
spring.sql.init.mode=never
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=Existing Stockline schema before Flyway
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:24}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}
server.tomcat.threads.max=${SERVER_TOMCAT_MAX_THREADS:200}
server.tomcat.threads.min-spare=${SERVER_TOMCAT_MIN_SPARE_THREADS:10}
spring.datasource.name=stockline
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false
server.error.include-message=never
stockline.fulfillment-delay=12s
stockline.reservation-ttl=30m
stockline.events.worker-count=4
stockline.events.batch-size=16
stockline.events.poll-interval-ms=500
stockline.events.queue-capacity=8
stockline.events.lease=45s
stockline.events.processing-timeout=30s
stockline.events.retry.max-attempts=8
stockline.events.retry.base-delay=1s
stockline.events.retry.max-delay=5m
stockline.retry.max-attempts=8
stockline.retry.base-delay=2ms
stockline.retry.max-delay=100ms
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.health.roles=ADMIN
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
management.info.env.enabled=true
management.metrics.distribution.percentiles[http.server.requests]=0.5,0.95,0.99
management.metrics.distribution.percentiles-histogram[http.server.requests]=true
