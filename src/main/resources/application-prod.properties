spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:32}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:8}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}
spring.flyway.baseline-on-migrate=true
server.address=0.0.0.0
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
stockline.jwt.secret=${JWT_SECRET}
stockline.auth.secure-cookie=${STOCKLINE_SECURE_COOKIE:true}
stockline.admin.username=${STOCKLINE_ADMIN_USERNAME:}
stockline.admin.password=${STOCKLINE_ADMIN_PASSWORD:}
stockline.demo.enabled=false
stockline.demo.initialize=false
logging.structured.format.console=logstash
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
logging.level.org.springframework.jdbc=INFO
logging.level.org.flywaydb=INFO
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
