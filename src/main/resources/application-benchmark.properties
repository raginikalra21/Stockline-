server.port=${SERVER_PORT:18080}
spring.datasource.url=jdbc:h2:mem:stockline-benchmark;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=4000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:8}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.flyway.baseline-on-migrate=false
stockline.jwt.secret=${JWT_SECRET}
stockline.auth.secure-cookie=false
stockline.admin.username=${STOCKLINE_ADMIN_USERNAME}
stockline.admin.password=${STOCKLINE_ADMIN_PASSWORD}
stockline.fulfillment-delay=${BENCHMARK_FULFILLMENT_DELAY:1s}
